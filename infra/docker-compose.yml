services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eli
      POSTGRES_PASSWORD: eli
      POSTGRES_DB: eli
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eli -d eli"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
